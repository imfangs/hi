<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taste. Build. Sell. — 六种表达</title></head><body>
<header><a href="https://hi.fangs.cc">fangs.</a><span>口号实验 / 01—06</span><button id="pause" type="button">暂停动态</button></header>
