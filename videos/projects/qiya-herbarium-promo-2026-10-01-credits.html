<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇芽药草铺 · 素材说明</title><style>body{font:17px/1.8 system-ui,sans-serif;max-width:760px;margin:64px auto;padding:0 24px;color:#272923;background:#fafaf7}a{color:#8a452c}h1{line-height:1.4;font-size:28px}</style><main><h1>奇芽药草铺 · 宣传片</h1><p>本片使用与线上 v0.9.3 前端一致的界面、独立演示存档和真实输入，展示森林采集、材料选择、植物摆放、攀援、整组移动与出售。</p><p>演示中的材料、金币和成熟植物经过场景准备；六张植物插画复用本项目已有 AI 生成素材。片中没有进行实时生成，也没有记录自然成长等待；植物详情不是前一镜头材料当场生成的结果。全片保留演示存档与素材来源说明。</p><p>页面固定美术沿用本项目素材。配乐为本片原创程序合成，无外部采样和人声，非游戏现场录音。字幕使用系统 Songti SC / STHeiti 栅格化，不分发字体文件。</p><p><a href="https://qiya.fangs.cc/">推开温室的门</a> · <a href="/projects/qiya-herbarium/">返回作品介绍</a></p></main></html>
